<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TODAI Forest Lv1 50 Concepts / 2026-W24</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#f5f7fb;color:#111827}
.app{max-width:900px;margin:0 auto;padding:16px 14px 130px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
h1{font-size:25px;margin:0;font-weight:1000;letter-spacing:-.04em}
.sub{font-size:13px;color:#64748b;line-height:1.5;margin-top:4px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:26px;padding:20px;box-shadow:0 14px 40px rgba(15,23,42,.08)}
.badge{display:inline-block;background:#eef6ff;color:#1d4ed8;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;margin:3px}
.hook{font-size:clamp(25px,6vw,44px);line-height:1.18;font-weight:1000;letter-spacing:-.05em;text-align:center;margin:18px 0}
.question{background:#fff7ed;border-left:7px solid #f59e0b;border-radius:16px;padding:14px;color:#7c2d12;font-size:17px;font-weight:900}
.choices{display:grid;gap:10px;margin-top:12px}
.choice{border:1px solid #dbe3ef;background:#fff;border-radius:16px;padding:15px;text-align:left;font-size:16px;font-weight:850;color:#111827;cursor:pointer}
.choice.correct{background:#dcfce7;border-color:#86efac;color:#166534}
.choice.wrong{background:#fee2e2;border-color:#fecaca;color:#991b1b}
.result{display:none;margin-top:14px;background:#eff6ff;border-left:7px solid #2563eb;border-radius:16px;padding:14px;color:#1e3a8a;line-height:1.65}
.result.show{display:block}
.wordbox{display:none;margin-top:14px;border-top:1px solid #e5e7eb;padding-top:14px}
.wordbox.show{display:block}
.word{font-size:44px;font-weight:1000;letter-spacing:-.05em;text-align:center}
.example{font-size:17px;font-weight:900;margin-top:10px;text-align:center}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.action{border:0;border-radius:14px;padding:12px 8px;font-weight:1000;cursor:pointer;background:#e2e8f0;color:#0f172a}
.green{background:#16a34a;color:white}.blue{background:#2563eb;color:white}.purple{background:#7c3aed;color:white}
.extra{display:none;margin-top:14px}.extra.show{display:block}
.extraTitle{padding:12px;border-radius:16px;background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d;font-weight:1000;text-align:center}
.layer{border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;margin-top:10px;background:#f8fafc}
.layer button{width:100%;border:0;background:#f8fafc;color:#111827;padding:13px 14px;text-align:left;font-size:15px;font-weight:1000;cursor:pointer}
.content{display:none;padding:15px;background:white;border-top:1px solid #e5e7eb;color:#334155;line-height:1.75;font-size:15px}
.open .content{display:block}
.arrow{font-size:26px;font-weight:1000;text-align:center;color:#7c3aed;margin:10px 0}
.encounter{display:none;margin-top:14px;padding:14px;border-radius:16px;background:#fafafa;border:1px solid #e5e7eb}
.encounter.show{display:block}
.encounter h3{margin:0 0 8px;font-size:16px}
.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.check{padding:10px;border:1px solid #e5e7eb;border-radius:12px;background:white;font-weight:800}
.footer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(245,247,251,0),#f5f7fb 30%);padding:36px 14px 14px}
.nav{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.nav button{border:0;border-radius:16px;min-height:54px;font-size:16px;font-weight:1000;cursor:pointer}
.primary{background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}
.progress{font-size:13px;color:#64748b;text-align:right;margin-bottom:8px}
select{border-radius:10px;padding:7px;font-weight:800;max-width:190px}
.logPanel{position:fixed;right:14px;bottom:92px;z-index:9999;background:rgba(255,255,255,.96);border:1px solid #e5e7eb;border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(15,23,42,.18);width:min(360px,calc(100vw - 28px))}
.logPanel.collapsed .logBody{display:none}
.logHead{display:flex;justify-content:space-between;align-items:center;font-weight:1000}
.logGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.logGrid button,.portalBtn{border:0;border-radius:12px;padding:10px;font-weight:900;background:#e2e8f0;color:#0f172a;cursor:pointer}
.portalBtn{background:#dbeafe;color:#1d4ed8}
@media(max-width:560px){.actions,.checks{grid-template-columns:1fr}header{display:block}}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>TODAI Forest Lv1: 50 Concepts</h1>
    <div class="sub">English-only quiz with Concept Encounter Log / 2026-W24</div>
  </div>
  <div>
    <button class="portalBtn" onclick="location.href='./index.html'">Portal</button><br><br>
    <select id="voiceSelect"></select><br>
    <select id="rateSelect"><option value="0.72">Slow</option><option value="0.86" selected>Normal</option><option value="1.0">Fast</option></select>
  </div>
</header>

<div class="progress" id="progress"></div>
<section class="card">
  <div><span class="badge" id="qid"></span><span class="badge" id="concept"></span></div>
  <div class="hook" id="hook"></div>
  <div class="question" id="question"></div>
  <div class="choices" id="choices"></div>
  <div class="result" id="result"></div>

  <div class="wordbox" id="wordbox">
    <div class="word" id="word"></div>
    <div class="example" id="example"></div>
    <div class="actions">
      <button class="action green" onclick="speakWord()">▶ Word</button>
      <button class="action blue" onclick="speakExample()">▶ Example</button>
      <button class="action purple" onclick="speakConcept()">▶ Concept</button>
    </div>
  </div>

  <div class="extra" id="extra">
    <div class="extraTitle">Extra Study for TODAI<br>One more step toward academic thinking</div>
    <div class="layer" id="whyL"><button onclick="toggle('whyL')">❓ Why does this happen?</button><div class="content" id="why"></div></div>
    <div class="layer" id="connectL"><button onclick="toggle('connectL')">How TODAI students remember it</button><div class="content"><div id="connect"></div><div class="arrow" id="arrow"></div></div></div>
    <div class="layer" id="challengeL"><button onclick="toggle('challengeL')">✍️ Challenge: Build a one-sentence story</button><div class="content" id="challenge"></div></div>
    <div class="layer" id="todaiL"><button onclick="toggle('todaiL')">How TODAI thinks</button><div class="content" id="todai"></div></div>
  </div>

  <div class="encounter" id="encounter">
    <h3>Where have you seen this concept?</h3>
    <div class="checks" id="checks"></div>
  </div>
</section>
</div>

<div class="logPanel collapsed" id="logPanel">
  <div class="logHead"><span>Weekly Log</span><button onclick="toggleLog()">＋</button></div>
  <div class="logBody">
    <div id="logStatus" style="font-size:12px;color:#475569;margin-top:6px"></div>
    <div class="logGrid">
      <button onclick="exportJSON()">JSON</button>
      <button onclick="exportCSV()">CSV</button>
      <button onclick="copySummary()">Copy Summary</button>
      <button onclick="clearLogs()">Clear</button>
    </div>
  </div>
</div>

<div class="footer">
  <div class="nav">
    <button class="secondary" onclick="prev()">← Prev</button>
    <button class="primary" onclick="next()">Next →</button>
    <button class="secondary" onclick="resetQ()">Retry</button>
  </div>
</div>

const ENCOUNTERS=["School","Common Test","Target1900 / vocabulary book","Information Studies","Programming","AI / ChatGPT","News","Daily life","First time today"];
const WEEK_LABEL="2026-W24";
const STORAGE_PREFIX="todai50_concepts_2026W24";
let idx=Number(localStorage.getItem(STORAGE_PREFIX+'_idx')||0);
let solved=JSON.parse(localStorage.getItem(STORAGE_PREFIX+'_solved')||'[]');
let logs=JSON.parse(localStorage.getItem(STORAGE_PREFIX+'_logs')||'{}');
let answered=false;

function $(id){return document.getElementById(id)}
function cur(){return Q[idx]}
function toggle(id){$(id).classList.toggle('open')}

function render(){
  const q=cur(); answered=false;
  document.querySelectorAll('.layer').forEach(x=>x.classList.remove('open'));
  $('qid').textContent=q.id; $('concept').textContent=q.concept;
  $('hook').textContent=q.hook; $('question').textContent=q.question;
  $('result').classList.remove('show'); $('result').innerHTML='';
  $('wordbox').classList.remove('show'); $('extra').classList.remove('show'); $('encounter').classList.remove('show');
  $('word').textContent=q.word; $('example').textContent=q.example;
  $('why').textContent=q.deep;
  $('connect').textContent='How TODAI students remember it: '+q.concept+' is not just a word. It is a reusable thinking tool.';
  $('arrow').textContent=q.arrow;
  $('challenge').textContent=q.challenge;
  $('todai').textContent=q.todai;
  const choices=[...q.choices].sort(()=>Math.random()-.5);
  $('choices').innerHTML='';
  choices.forEach(ch=>{const b=document.createElement('button');b.className='choice';b.textContent=ch;b.onclick=()=>answer(ch,b);$('choices').appendChild(b)});
  renderChecks();
  $('progress').textContent=`${idx+1} / ${Q.length} Cleared ${solved.length} / ${Q.length}`;
  localStorage.setItem(STORAGE_PREFIX+'_idx',idx);
  updateLogStatus();
}

function renderChecks(){
  const q=cur(); const saved=(logs[q.id]&&logs[q.id].encounters)||[];
  $('checks').innerHTML='';
  ENCOUNTERS.forEach(name=>{const lab=document.createElement('label');lab.className='check';const cb=document.createElement('input');cb.type='checkbox';cb.checked=saved.includes(name);cb.onchange=()=>saveEncounter();lab.appendChild(cb);lab.appendChild(document.createTextNode(' '+name));$('checks').appendChild(lab)});
}

function saveEncounter(){
  const q=cur();
  const vals=[...document.querySelectorAll('#checks input')].map((cb,i)=>cb.checked?ENCOUNTERS[i]:null).filter(Boolean);
  if(!logs[q.id]) logs[q.id]={};
  logs[q.id].encounters=vals; logs[q.id].lastSeen=new Date().toISOString();
  localStorage.setItem(STORAGE_PREFIX+'_logs',JSON.stringify(logs));
  updateLogStatus();
}

function answer(ch,btn){
  if(answered)return; answered=true;
  const q=cur(); const ok=ch===q.answer;
  document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct')});
  if(!ok)btn.classList.add('wrong');
  if(ok&&!solved.includes(q.id)){solved.push(q.id);localStorage.setItem(STORAGE_PREFIX+'_solved',JSON.stringify(solved))}
  if(!logs[q.id])logs[q.id]={};
  logs[q.id].attempts=(logs[q.id].attempts||0)+1;
  logs[q.id].lastCorrect=ok; logs[q.id].lastAnswer=ch; logs[q.id].lastAnsweredAt=new Date().toISOString();
  logs[q.id].concept=q.concept; logs[q.id].word=q.word; logs[q.id].weekLabel=WEEK_LABEL;
  localStorage.setItem(STORAGE_PREFIX+'_logs',JSON.stringify(logs));
  $('result').classList.add('show'); $('result').innerHTML=`<b>${ok?'Correct.':'Almost.'}</b><br>${q.explain}`;
  $('wordbox').classList.add('show'); $('extra').classList.add('show'); $('encounter').classList.add('show');
  $('progress').textContent=`${idx+1} / ${Q.length} Cleared ${solved.length} / ${Q.length}`;
  updateLogStatus();
}

function next(){idx=(idx+1)%Q.length;render()}
function prev(){idx=(idx-1+Q.length)%Q.length;render()}
function resetQ(){render()}

function toggleLog(){const p=$('logPanel');p.classList.toggle('collapsed');p.querySelector('.logHead button').textContent=p.classList.contains('collapsed')?'＋':'－';updateLogStatus()}
function getFlatLogs(){return Object.entries(logs).map(([id,v])=>({id,...v}))}
function updateLogStatus(){const rows=getFlatLogs();const attempts=rows.reduce((s,x)=>s+(x.attempts||0),0);const correct=rows.filter(x=>x.lastCorrect===true).length;$('logStatus').innerHTML=`Week: ${WEEK_LABEL}<br>Concepts touched: ${rows.length} / 50<br>Attempts: ${attempts} / Last correct concepts: ${correct}`;}
function downloadText(filename,text,type){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){const payload={app:'TODAI Forest Lv1 50 Concepts',weekLabel:WEEK_LABEL,exportedAt:new Date().toISOString(),solved,logs,questions:Q};downloadText('todai_forest_lv1_50_concepts_2026-W24.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8')}
function csvEscape(v){return '"' + String(v??'').replace(/"/g,'""') + '"'}
function exportCSV(){const headers=['id','concept','word','attempts','lastCorrect','lastAnswer','lastAnsweredAt','encounters'];const rows=[headers.join(',')].concat(getFlatLogs().map(r=>headers.map(h=>csvEscape(Array.isArray(r[h])?r[h].join(' / '):r[h])).join(',')));downloadText('todai_forest_lv1_50_concepts_2026-W24.csv','\uFEFF'+rows.join('\n'),'text/csv;charset=utf-8')}
function copySummary(){const rows=getFlatLogs();const attempts=rows.reduce((s,x)=>s+(x.attempts||0),0);const txt=`TODAI Forest Lv1 50 Concepts ${WEEK_LABEL}\nconcepts_touched: ${rows.length}\nattempts: ${attempts}\ncleared: ${solved.length}`;navigator.clipboard.writeText(txt).then(()=>alert('Summary copied.'))}
function clearLogs(){if(!confirm('Clear TODAI Forest logs?'))return;logs={};solved=[];localStorage.removeItem(STORAGE_PREFIX+'_logs');localStorage.removeItem(STORAGE_PREFIX+'_solved');render()}

let voices=[],englishVoices=[];
function isEnglishVoice(v){const s=(v.lang+' '+v.name).toLowerCase();return s.includes('en-')||s.includes('english')||s.includes('us')||s.includes('uk')}
function loadVoices(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices();englishVoices=voices.filter(isEnglishVoice);const sel=$('voiceSelect');sel.innerHTML='';englishVoices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+' / '+v.lang;sel.appendChild(o)});if(englishVoices[0])sel.value=englishVoices[0].name}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,200);setTimeout(loadVoices,800)}
function getVoice(){const sel=$('voiceSelect');return englishVoices.find(v=>sel&&v.name===sel.value)||englishVoices[0]||null}
function speak(t){if(!('speechSynthesis'in window))return;const v=getVoice();if(!v)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang||'en-US';u.rate=Number($('rateSelect').value||0.86);speechSynthesis.speak(u)}
function speakWord(){speak(cur().word)} 
function speakExample(){speak(cur().example)} 
function speakConcept(){speak(cur().concept+'. '+cur().example)}
render();
</script>
</body>
</html>
