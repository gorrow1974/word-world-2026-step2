<!doctype html>

<title>東大の森 Weekly 50 / 2026-W24</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#07111f;color:#fff}

.app{max-width:980px;margin:0 auto;padding:14px 14px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.logo{font-size:24px;font-weight:1000;letter-spacing:-.04em}
.logo span{color:#86efac}
.sub{color:#cbd5e1;font-size:13px;margin-top:4px}
.panel{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:16px;margin:12px 0;backdrop-filter:blur(8px)}
.hero{min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(135deg,rgba(22,163,74,.28),rgba(37,99,235,.20)),rgba(255,255,255,.06);border-radius:30px;padding:26px;border:1px solid rgba(255,255,255,.18);box-shadow:0 24px 80px rgba(0,0,0,.35)}
.kicker{display:inline-block;width:max-content;background:#dcfce7;color:#166534;border-radius:999px;padding:7px 12px;font-weight:1000;font-size:13px}
h1{font-size:clamp(34px,7vw,72px);line-height:1;margin:12px 0 0;letter-spacing:-.06em}
button{border:0;border-radius:18px;padding:14px;font-weight:900;min-height:58px;font:inherit;cursor:pointer;touch-action:manipulation}
.primary{background:#22c55e;color:#052e16}
.secondary{background:#334155;color:#fff}
.good{background:#16a34a;color:#fff}
.bad{background:#dc2626;color:#fff}
.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.grid{display:grid;gap:12px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:rgba(255,255,255,.10);border-radius:18px;padding:14px}
.stat b{font-size:30px}
.flash{display:none}
.flash.active{display:block}
.card{min-height:360px;background:#f8fafc;color:#0f172a;border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.word{font-size:clamp(58px,13vw,124px);font-weight:1000;letter-spacing:-.07em;line-height:1}
.meaning{font-size:clamp(18px,3vw,28px);color:#475569;margin-top:24px;line-height:1.45}
.meta{color:#dbeafe;font-weight:800;display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}
.timer-wrap{height:14px;background:rgba(255,255,255,.18);border-radius:999px;margin:10px 0 18px;overflow:hidden}
#bar{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444);transform-origin:left}
.actions{position:fixed;left:0;right:0;bottom:0;max-width:980px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;background:linear-gradient(180deg,rgba(7,17,31,0),#07111f 26%);padding:34px 14px 16px}
.answer{min-height:84px;font-size:22px;border-radius:24px}
.table{max-height:48vh;overflow:auto;background:#fff;color:#0f172a;border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#e2e8f0}
#logPanel{position:fixed;right:14px;bottom:116px;z-index:9999;width:min(360px,calc(100vw - 28px));background:rgba(255,255,255,.96);color:#0f172a;border-radius:18px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.25)}
#logPanel.collapsed .body{display:none}
#logPanel button{min-height:42px;padding:8px 10px;border-radius:12px;background:#e2e8f0;color:#0f172a}
.small{font-size:12px;color:#cbd5e1;line-height:1.45}

@media(max-width:700px){.two,.three{grid-template-columns:1fr}.card{min-height:310px}}

<div class="app">
<header>
  <div>
    <div class="logo">東大の森 <span>Weekly 50</span></div>
    <div class="sub">2026-W24 / 3秒フラッシュ / localStorageログ対応</div>
  </div>
  <button class="ghost" onclick="goHome()">Home</button>
</header>

<section id="home">
  <div class="hero">
    <span class="kicker">今週の50語</span>
    <h1>森に入る。<br>3秒で反応する。</h1>
    <p class="small">迷ったら「知らない」。調べるのは最後。ログはJSON/CSVで出力できます。</p>
  </div>

  <div class="panel">
    <h2>Start</h2>
    <div class="grid two">
      <button class="primary" onclick="startRun('random')">Random Start</button>
      <button class="secondary" onclick="startRun('sequential')">Sequential Start</button>
    </div>
  </div>

  <div class="panel">
    <h2>今週のKPI</h2>
    <div id="kpi" class="stats"></div>
  </div>

  <div class="panel">
    <h2>今週の50語一覧</h2>
    <div id="wordTable" class="table"></div>
  </div>
</section>

<section id="flash" class="flash">
  <div class="meta">
    <div id="progress">0 / 50</div>
    <div id="meta">Part - / Section -</div>
  </div>
  <div class="timer-wrap"><div id="bar"></div></div>
  <div class="card">
    <div id="flashWord" class="word"></div>
    <div id="flashMeaning" class="meaning"></div>
  </div>
</section>

<div class="actions" id="actions" style="display:none">
  <button class="bad answer" onclick="answer(false)">← 知らない</button>
  <button class="good answer" onclick="answer(true)">知ってる →</button>
</div>
</div>

<div id="logPanel" class="collapsed">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900">
    <span>Weekly Log</span>
    <button onclick="toggleLog()">＋</button>
  </div>
  <div class="body">
    <p id="logStatus" class="small">loading...</p>
    <div class="grid two">
      <button onclick="exportJSON()">JSON</button>
      <button onclick="exportCSV()">CSV</button>
      <button onclick="copySummary()">Copy Summary</button>
      <button onclick="clearLogs()">Clear</button>
    </div>
  </div>
</div>

const STORAGE_KEY = "todai_forest_weekly_50_" + WEEK_LABEL;
let queue = [];
let currentIndex = 0;
let startedAt = 0;
let timerId = null;
let timeLimitMs = 3000;

function getLogs() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
  catch(e) { return []; }
}
function setLogs(logs) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
  renderKPI();
  updateLogStatus();
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function startRun(mode) {
  queue = mode === "random" ? shuffle(WORDS) : WORDS.slice();
  currentIndex = 0;
  document.getElementById("home").style.display = "none";
  document.getElementById("flash").classList.add("active");
  document.getElementById("actions").style.display = "grid";
  showQuestion();
}
function goHome() {
  clearTimeout(timerId);
  document.getElementById("home").style.display = "block";
  document.getElementById("flash").classList.remove("active");
  document.getElementById("actions").style.display = "none";
  renderKPI();
  renderTable();
}
function showQuestion() {
  clearTimeout(timerId);
  if (currentIndex >= queue.length) {
    alert("完了。Weekly LogからJSONまたはCSVを出力してください。");
    goHome();
    return;
  }
  const q = queue[currentIndex];
  startedAt = performance.now();
  document.getElementById("progress").textContent = (currentIndex+1) + " / " + queue.length;
  document.getElementById("meta").textContent = "Part " + q.part + " / Section " + q.section + " / " + q.level;
  document.getElementById("flashWord").textContent = q.word;
  document.getElementById("flashMeaning").textContent = q.meaning;
  animateBar();
  timerId = setTimeout(() => answer(false, true), timeLimitMs);
}
function animateBar() {
  const bar = document.getElementById("bar");
  bar.style.transition = "none";
  bar.style.transform = "scaleX(1)";
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      bar.style.transition = "transform " + timeLimitMs + "ms linear";
      bar.style.transform = "scaleX(0)";
    });
  });
}
function answer(known, timeout=false) {
  clearTimeout(timerId);
  const q = queue[currentIndex];
  const elapsed = Math.round(performance.now() - startedAt);
  const logs = getLogs();
  logs.push({
    timestamp: new Date().toISOString(),
    weekLabel: WEEK_LABEL,
    eventType: "answer",
    questionId: q.id,
    word: q.word,
    meaning: q.meaning,
    part: q.part,
    section: q.section,
    level: q.level,
    conceptTag: q.concept,
    variableLayer: q.variableLayer,
    userAnswer: known ? "known" : "unknown",
    isCorrect: known,
    timeout: timeout,
    responseTimeMs: elapsed,
    pagePath: location.pathname
  });
  setLogs(logs);
  currentIndex++;
  showQuestion();
}
function renderKPI() {
  const logs = getLogs().filter(x => x.eventType === "answer");
  const total = logs.length;
  const known = logs.filter(x => x.userAnswer === "known").length;
  const unknown = logs.filter(x => x.userAnswer === "unknown").length;
  const timeout = logs.filter(x => x.timeout).length;
  const avg = logs.length ? Math.round(logs.reduce((s,x)=>s+(x.responseTimeMs||0),0)/logs.length) : 0;
  document.getElementById("kpi").innerHTML = `
    <div class="stat"><span>attempts</span><br><b>${total}</b></div>
    <div class="stat"><span>known</span><br><b>${known}</b></div>
    <div class="stat"><span>unknown</span><br><b>${unknown}</b></div>
    <div class="stat"><span>timeout</span><br><b>${timeout}</b></div>
    <div class="stat"><span>avg ms</span><br><b>${avg}</b></div>
  `;
}
function renderTable() {
  const logs = getLogs();
  const lastByWord = {};
  logs.forEach(l => lastByWord[l.questionId] = l);
  let rows = WORDS.map(w => {
    const l = lastByWord[w.id] || {};
    return `<tr><td>${w.id}</td><td><b>${w.word}</b></td><td>${w.meaning}</td><td>${w.concept}</td><td>${l.userAnswer||""}</td><td>${l.responseTimeMs||""}</td></tr>`;
  }).join("");
  document.getElementById("wordTable").innerHTML = `<table><thead><tr><th>ID</th><th>word</th><th>meaning</th><th>concept</th><th>last</th><th>ms</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function updateLogStatus() {
  const logs = getLogs().filter(x => x.eventType === "answer");
  const known = logs.filter(x => x.userAnswer === "known").length;
  const rate = logs.length ? Math.round(known/logs.length*1000)/10 : 0;
  document.getElementById("logStatus").innerHTML = "Week: " + WEEK_LABEL + "<br>Logs: " + logs.length + " / Known rate: " + rate + "%<br>Storage: " + STORAGE_KEY;
}
function toggleLog() {
  const p = document.getElementById("logPanel");
  p.classList.toggle("collapsed");
  p.querySelector("button").textContent = p.classList.contains("collapsed") ? "＋" : "－";
  updateLogStatus();
}
function downloadText(filename, text, type) {
  const blob = new Blob([text], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportJSON() {
  const payload = {
    app: "Todai Forest Weekly 50",
    weekLabel: WEEK_LABEL,
    exportedAt: new Date().toISOString(),
    storageKey: STORAGE_KEY,
    words: WORDS,
    logs: getLogs()
  };
  downloadText("todai_forest_weekly_50_" + WEEK_LABEL + ".json", JSON.stringify(payload,null,2), "application/json;charset=utf-8");
}
function csvEscape(v) {
  if (v === undefined || v === null) return '""';
  return '"' + String(v).replace(/"/g,'""') + '"';
}
function exportCSV() {
  const headers = ["timestamp","weekLabel","questionId","word","meaning","part","section","level","conceptTag","variableLayer","userAnswer","isCorrect","timeout","responseTimeMs","pagePath"];
  const rows = [headers.join(",")].concat(getLogs().map(l => headers.map(h => csvEscape(l[h])).join(",")));
  downloadText("todai_forest_weekly_50_" + WEEK_LABEL + ".csv", "\uFEFF" + rows.join("\n"), "text/csv;charset=utf-8");
}
function copySummary() {
  const logs = getLogs().filter(x => x.eventType === "answer");
  const known = logs.filter(x => x.userAnswer === "known").length;
  const unknown = logs.filter(x => x.userAnswer === "unknown").length;
  const timeout = logs.filter(x => x.timeout).length;
  const avg = logs.length ? Math.round(logs.reduce((s,x)=>s+(x.responseTimeMs||0),0)/logs.length) : 0;
  const text = `東大の森 Weekly 50 ${WEEK_LABEL}
attempts: ${logs.length}
known: ${known}
unknown: ${unknown}
timeout: ${timeout}
avg_ms: ${avg}`;
  navigator.clipboard.writeText(text).then(()=>alert("Summary copied."));
}
function clearLogs() {
  if (!confirm("この週のログを削除しますか？")) return;
  localStorage.removeItem(STORAGE_KEY);
  renderKPI();
  renderTable();
  updateLogStatus();
}
renderKPI();
renderTable();
updateLogStatus();
</script>
</body>
</html>
